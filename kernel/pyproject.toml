[project]
name = "trunade"
version = "0.1.0"
description = "Jupyter kernel that compiles and runs C++ cells from Markdown"
authors = [
    { name = "Daniel Porto", email = "danielpporto@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

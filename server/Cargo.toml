[package]
name = "trunade"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
comrak = "0.55.0"
libc = "0.2.190"
mime_guess = "2.0.5"
notify-debouncer-full = "0.7.0"
portable-pty = "0.9.0"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs"] }
